<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Раскраска | Указатели</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fdf8e7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
        }
        .top-bar {
            width: 100%;
            max-width: 900px;
            margin-bottom: 12px;
            text-align: left;
        }
        .brand-link {
            color: #4A90D9;
            text-decoration: none;
            font-size: 1rem;
            border-bottom: 1px solid #4A90D9;
            padding-bottom: 2px;
        }
        .brand-link:hover { color: #2c6aa0; }
        .image-wrapper {
            max-width: 900px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(100, 70, 30, 0.12);
            border: 1px solid #e6dacb;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .image-wrapper img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .image-wrapper { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="https://vk.com/ykazateli_of_christ" target="_blank" class="brand-link">
            🕯️ Библейская студия анимации «Указатели»
        </a>
    </div>
    <div class="image-wrapper">
        <img src="image.jpeg" alt="Раскраска">
    </div>
</body>
</html>
